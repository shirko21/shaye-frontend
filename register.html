<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080c0f">
  <title>ثبت‌نام | SHAYE</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <style>
    #message {
      margin-top: 14px;
      min-height: 24px;
      line-height: 1.9;
      text-align: center;
    }
    #message.success { color: #2ad382; }
    #message.error { color: #ff6b6b; }
    .invite-note {
      margin-top: 7px;
      font-size: 11px;
      line-height: 1.8;
      opacity: .68;
    }
  </style>
  <link rel="stylesheet" href="assets/css/i18n.css">
  <link rel="stylesheet" href="assets/css/v6.css">
  <link rel="stylesheet" href="assets/css/premium.css">
</head>
<body>
  <main class="login-container">
    <form id="registerForm" class="register-card">
      <div class="custom-logo">S</div>
      <h2>ساخت حساب SHAYE</h2>
      <p>حساب شخصی خود را ایجاد کنید</p>

      <div class="input-group">
        <label for="registerFullname">نام و نام خانوادگی</label>
        <input
          id="registerFullname"
          type="text"
          placeholder="نام و نام خانوادگی"
          autocomplete="name"
          maxlength="100"
          required
        >
      </div>

      <div class="input-group">
        <label for="registerUsername">نام کاربری</label>
        <input
          id="registerUsername"
          type="text"
          placeholder="نام کاربری انگلیسی"
          autocomplete="username"
          minlength="3"
          maxlength="32"
          pattern="[a-zA-Z0-9_.-]{3,32}"
          required
        >
      </div>

      <div class="input-group">
        <label for="registerEmail">ایمیل</label>
        <input
          id="registerEmail"
          type="email"
          placeholder="example@gmail.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="input-group">
        <label for="registerPhone">شماره تلفن (اختیاری)</label>
        <input
          id="registerPhone"
          type="tel"
          placeholder="+989123456789"
          autocomplete="tel"
          maxlength="20"
        >
      </div>

      <div class="input-group">
        <label for="registerPassword">رمز عبور</label>
        <input
          id="registerPassword"
          type="password"
          placeholder="حداقل ۸ کاراکتر"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
        >
      </div>

      <div class="input-group">
        <label for="confirmPassword">تکرار رمز عبور</label>
        <input
          id="confirmPassword"
          type="password"
          placeholder="تکرار رمز عبور"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
        >
      </div>

      <div class="input-group">
        <label for="inviteCode">کد دعوت (اختیاری)</label>
        <input id="inviteCode" type="text" placeholder="کد معرف" autocomplete="off">
        <div class="invite-note">اگر از لینک دعوت وارد شده باشید، کد به‌صورت خودکار تکمیل می‌شود.</div>
      </div>

      <button class="btn-green" id="registerButton" type="submit">ثبت نام</button>

      <p class="switch-text">
        حساب دارید؟
        <a href="login.html">ورود</a>
      </p>

      <div id="message"></div>
    </form>
  </main>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/v6.js"></script>
  <script src="assets/js/premium.js"></script>
</body>
</html>
