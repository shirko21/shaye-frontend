<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SHAYE Login</title>


<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">


<link rel="stylesheet" href="assets/css/dashboard.css">


  <link rel="stylesheet" href="assets/css/i18n.css">
  <link rel="stylesheet" href="assets/css/v6.css">
  <link rel="stylesheet" href="assets/css/premium.css">
</head>



<body>



<main class="dashboard-container login-container">





<div class="card register-card">





<div class="custom-logo">

S

</div>





<h2>

ورود به SHAYE

</h2>





<p>

خوش آمدید، وارد حساب خود شوید

</p>








<div class="input-group">



<label>

ایمیل

</label>



<input

type="email"

id="loginEmail"

placeholder="example@email.com"

>



</div>








<div class="input-group">



<label>

رمز عبور

</label>



<input

type="password"

id="loginPassword"

placeholder="رمز عبور"

>



</div>
<button class="btn-green" onclick="loginUser()">

ورود

</button>





<p class="switch-text">

حساب ندارید؟

<a href="register.html">

ثبت‌نام

</a>


</p>





<div id="message">

</div>





</div>



</main>
<script>


function loginUser(){


let email = document.getElementById("loginEmail").value.trim().toLowerCase();


let password = document.getElementById("loginPassword").value;


let message = document.getElementById("message");





if(!email || !password){


message.innerHTML="لطفاً ایمیل و رمز عبور را وارد کنید";


return;


}






let users = JSON.parse(

localStorage.getItem("shaye_users")

) || [];






let user = users.find(

u => 

String(u.email || "").trim().toLowerCase() === email &&

u.password === password

);






if(!user){


message.innerHTML="ایمیل یا رمز عبور اشتباه است";


return;


}

if(user.blocked){
message.innerHTML="حساب شما توسط مدیریت مسدود شده است";
return;
}






localStorage.setItem(

"shaye_current_user",

email

);






message.innerHTML="ورود موفقیت‌آمیز بود";






setTimeout(()=>{


window.location.href="dashboard.html";


},800);





}



</script>





  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/v6.js"></script>
  <script src="assets/js/premium.js"></script>
</body>

</html>
