<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SHAYE Login</title>


<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">


<link rel="stylesheet" href="assets/css/dashboard.css">


  <link rel="stylesheet" href="assets/css/i18n.css">
  <link rel="stylesheet" href="assets/css/v6.css">
  <link rel="stylesheet" href="assets/css/premium.css">
</head>



<body>



<main class="dashboard-container login-container">





<form id="loginForm" class="card register-card">





<div class="custom-logo">

S

</div>





<h2>

ورود به SHAYE

</h2>





<p>

خوش آمدید، وارد حساب خود شوید

</p>








<div class="input-group">



<label>

ایمیل

</label>



<input

type="email"

id="loginEmail"

placeholder="example@email.com"

autocomplete="email"

required

>



</div>








<div class="input-group">



<label>

رمز عبور

</label>



<input

type="password"

id="loginPassword"

placeholder="رمز عبور"

autocomplete="current-password"

required

>



</div>
<button class="btn-green" type="submit">

ورود

</button>





<p class="switch-text">

حساب ندارید؟

<a href="register.html">

ثبت‌نام

</a>


</p>





<div id="message">

</div>





</form>



</main>

<script src="assets/js/api-client.js?v=20260719-1"></script>
<script src="assets/js/app.js?v=20260719-1"></script>





  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/v6.js"></script>
  <script src="assets/js/premium.js"></script>
</body>

</html>
